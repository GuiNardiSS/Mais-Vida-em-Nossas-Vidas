name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - nome-da-branch

jobs:
  build-apk:
    name: Build APK Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.7'
          channel: 'stable'
          cache: true

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.android/build-cache
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Validate Secrets
        run: |
          if [ -z "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "❌ ERROR: KEYSTORE_BASE64 secret is not set!"
            echo "Configure it at: https://github.com/${{ github.repository }}/settings/secrets/actions"
            exit 1
          fi
          if [ -z "${{ secrets.KEY_ALIAS }}" ] || [ -z "${{ secrets.KEY_PASSWORD }}" ] || [ -z "${{ secrets.STORE_PASSWORD }}" ]; then
            echo "❌ ERROR: One or more keystore secrets are missing!"
            exit 1
          fi
          echo "✅ All secrets are configured"

      - name: Decode Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "Decoding keystore..."
          echo "$KEYSTORE_BASE64" | base64 -d > "$PWD/android/maisvidaapp-release.jks"
          
          if [ ! -f "$PWD/android/maisvidaapp-release.jks" ]; then
            echo "❌ ERROR: Failed to create keystore file!"
            exit 1
          fi
          
          file "$PWD/android/maisvidaapp-release.jks"
          ls -lh "$PWD/android/maisvidaapp-release.jks"
          
          # Validate keystore
          keytool -list -keystore "$PWD/android/maisvidaapp-release.jks" \
            -storepass "${{ secrets.STORE_PASSWORD }}" \
            -alias "${{ secrets.KEY_ALIAS }}" 2>&1 | head -5 || {
            echo "❌ ERROR: Keystore validation failed! Check alias and passwords."
            exit 1
          }
          echo "✅ Keystore validated successfully"

      - name: Create key.properties
        env:
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        run: |
          printf "%s\n" \
            "storeFile=$PWD/android/maisvidaapp-release.jks" \
            "storePassword=$STORE_PASSWORD" \
            "keyAlias=$KEY_ALIAS" \
            "keyPassword=$KEY_PASSWORD" > android/key.properties
          cat android/key.properties

      - name: Build APK Release
        run: |
          flutter build apk --release \
            --dart-define=dart.vm.product=true \
            --obfuscate \
            --split-debug-info=build/app/outputs/symbols
        env:
          GRADLE_OPTS: -Dorg.gradle.jvmargs="-Xmx4g -XX:+HeapDumpOnOutOfMemoryError" -Dorg.gradle.daemon=false -Dorg.gradle.parallel=true -Dorg.gradle.workers.max=2

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: Create Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v1.0.0-${{ github.run_number }}
          name: Release v1.0.0-${{ github.run_number }}
          files: build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


name: meu_app_flutter
description: Aplicativo de espiritualidade e bem-estar — cartas, áudios e conteúdos.
publish_to: 'none'
version: 2.0.0+7
environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.3.2
  http: ^1.2.2
  flutter_local_notifications: ^19.4.1
  url_launcher: ^6.3.0
  video_player: ^2.8.7
  mask_text_input_formatter: ^2.9.0
  qr_flutter: ^4.1.0
  font_awesome_flutter: ^10.7.0
  audioplayers: ^6.1.0
  device_info_plus: ^10.1.0
  crypto: ^3.0.3
  sqflite: ^2.3.3+1
  path: ^1.9.0
  logger: ^2.4.0
  path_provider: ^2.1.4
  intl: ^0.20.2
  flutter_secure_storage: ^9.2.4
  material_ui: ^1.11.0
  flutter_riverpod: ^3.5.0
  flutter_animate: ^4.5.2
  shimmer: ^4.0.0
  share_plus: ^12.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icon.png"

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/cartas_do_dia/
    - assets/cartas_do_dia_org/
    - assets/parceiros/
    - assets/conteudo/
    - assets/audios_cartas_dia/
    - assets/audios_cartas_org/
    - assets/perfil/
    - assets/assinaturas/
    - assets/intro/

  fonts:
    - family: Lora
      fonts:
        - asset: assets/fonts/Lora-Regular.ttf
          weight: 400
        - asset: assets/fonts/Lora-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Lora-Bold.ttf
          weight: 700
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
